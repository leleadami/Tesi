# Transformer Configuration

# Data parameters
data:
  target_variable: "cooling_demand"  # Primary target (heating_demand=0 in summer!)
  sequence_length: 24                # Lookback window (hours)
  forecast_horizon: 1                # Predict N hours ahead

# Model architecture
model:
  name: "transformer"
  d_model: 64               # Model dimension (embedding size) - OPTIMIZED
  nhead: 4                  # Number of attention heads (d_model must be divisible by nhead) - OPTIMIZED
  num_layers: 2             # Number of transformer encoder layers
  dim_feedforward: 256      # Dimension of feedforward network (typically 4x d_model)
  dropout: 0.2              # Dropout rate
  output_size: 1            # Single value prediction
  use_causal_mask: true     # Causal mask: impedisce vedere timestep futuri (raccomandato!)
  use_weighted_pooling: true  # Weighted pooling: impara pesi per ogni timestep (vs media uniforme) - OPTIMIZED

# Training parameters
training:
  batch_size: 32
  num_epochs: 100
  learning_rate: 0.001             # OPTIMIZED learning rate
  weight_decay: 0.0001             # L2 regularization
  early_stopping_patience: 15      # Stop if no improvement for N epochs
  gradient_clip: 1.0               # Max gradient norm (prevent exploding gradients)
  seed: 42                         # Random seed for reproducibility

# Evaluation metrics
metrics:
  - mae
  - rmse
  - mse
  - mape
  - smape
  - r2

# Output paths
output:
  results_dir: "../../results"
  checkpoint_dir: "../../results/checkpoints"
  figures_dir: "../../results/figures"
  save_predictions: true
  save_models: true
